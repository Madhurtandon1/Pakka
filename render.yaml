# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Render builds the Dockerfile (which also runs the evals,
# so a broken safety rule fails the deploy). Inside the container, nginx listens on the port
# Render assigns, serves the pages, and proxies the API to FastAPI (see deploy/).
services:
  - type: web
    name: pakka-languages          # separate service: English, Hindi, Bengali, Odia, Telugu demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: languages-demo         # deploys only this branch; main and skip-today are untouched
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Optional: Sarvam Bulbul voice. Leave empty to use the browser's voice.
      - key: SARVAM_API_KEY
        sync: false
