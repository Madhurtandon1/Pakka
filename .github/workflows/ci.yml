name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-ocr.txt && pip install --no-deps "rapidocr_onnxruntime>=1.2.3,<1.5"
      - run: pytest -q
      - run: python eval/run_eval.py
      - run: python eval/holdout.py
      - run: python eval/merchant_eval.py
      - run: python eval/docs_scenarios.py
